name: Website
on:
  push:
    paths: ["apps/web/**", "package*.json", "scripts/sync-web-assets.mjs", "scripts/web-seo.test.mjs", "assets/**", ".github/workflows/web.yml", "Sources/StrickeyCore/Resources/CherryMX/**"]
  pull_request:
    paths: ["apps/web/**", "package*.json", "scripts/sync-web-assets.mjs", "scripts/web-seo.test.mjs", "assets/**", ".github/workflows/web.yml", "Sources/StrickeyCore/Resources/CherryMX/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SITE_URL: https://strickey.example
      VERCEL_ENV: production
      SEO_EXPECT_SITE_URL: https://strickey.example
      SEO_EXPECT_INDEXABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify rendered SEO
        run: |
          npm run start > /tmp/strickey-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:seo

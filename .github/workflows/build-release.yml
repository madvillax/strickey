name: Build release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z)'
        required: true
        default: '0.2.1'
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            printf 'STRICKEY_RELEASE_VERSION=%s\n' "$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            printf 'STRICKEY_RELEASE_VERSION=%s\n' "${TAG_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Test recordings and keyboard filtering
        run: ./scripts/test.sh
      - name: Build universal DMG
        env:
          STRICKEY_GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/release.sh "$STRICKEY_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: strickey-${{ env.STRICKEY_RELEASE_VERSION }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/release-notes.md
          if-no-files-found: error
      - name: Prepare landing-page package
        run: node scripts/prepare-web-download.mjs "dist/Strickey-$STRICKEY_RELEASE_VERSION-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: strickey-website-download
          path: apps/web/public/downloads/
          if-no-files-found: error
